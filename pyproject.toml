[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrodb"
version = "0.1.0"
description = "Provider-agnostic historical financial & economic database (DuckDB + Parquet, Bronze/Silver)"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "pyarrow>=14", "requests>=2.31", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
macrodb = "macrodb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macrodb = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
